<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P File Sharing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Instant P2P File Sharing</h1>
        <p>Send files directly between devices using WebRTC.</p>
        
        <div class="upload-box">
            <input type="file" id="fileInput" hidden>
            <label for="fileInput" class="upload-area">
                <span>📂 Drag & Drop or Click to Select a File</span>
            </label>
            <button id="shareBtn">Generate Link</button>
        </div>

        <div id="result" class="hidden">
            <p>Share this link:</p>
            <div class="share-container">
                <input type="text" id="shareLink" readonly>
                <button id="copyBtn" onclick="copyToClipboard()">Copy</button>
            </div>
            <div id="qrCode"></div>
            <p id="connectionStatus"></p>
        </div>

        <div id="receiveSection" class="hidden">
            <h2>Receiving File...</h2>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
                <p id="receiverStatus">Waiting for connection...</p>
                <p id="transferSpeed"></p>
                <p id="timeRemaining"></p>
            </div>
            <a id="downloadLink" class="hidden download-button" download>Download File</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <script src="script.js"></script>

    <script>
        function copyToClipboard() {
            const shareLink = document.getElementById('shareLink');
            shareLink.select();
            document.execCommand('copy');
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.textContent = 'Copied!';
            setTimeout(() => {
                copyBtn.textContent = 'Copy';
            }, 2000);
        }

        // Add drag and drop functionality with live preview
        const uploadArea = document.querySelector('.upload-area');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            fileInput.files = e.dataTransfer.files;
            updateFilePreview(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            updateFilePreview(e.target.files[0]);
        });

        function updateFilePreview(file) {
            if (!file) return;
            
            const span = uploadArea.querySelector('span');
            span.innerHTML = `
                📂 Selected: ${file.name}<br>
                Size: ${formatFileSize(file.size)}<br>
                Type: ${file.type || 'Unknown'}
            `;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Add live connection status updates
        const connectionStatus = document.getElementById('connectionStatus');
        const transferSpeed = document.getElementById('transferSpeed');
        const timeRemaining = document.getElementById('timeRemaining');
        let startTime;
        let lastUpdate = Date.now();
        let lastBytes = 0;

        function updateTransferStats(receivedSize, totalSize) {
            if (!startTime) startTime = Date.now();
            
            const currentTime = Date.now();
            const timeDiff = (currentTime - lastUpdate) / 1000; // in seconds
            const bytesDiff = receivedSize - lastBytes;
            const speed = bytesDiff / timeDiff; // bytes per second
            
            const remainingBytes = totalSize - receivedSize;
            const remainingTime = remainingBytes / speed;

            transferSpeed.textContent = `Speed: ${formatFileSize(speed)}/s`;
            timeRemaining.textContent = `Time remaining: ${formatTime(remainingTime)}`;

            lastUpdate = currentTime;
            lastBytes = receivedSize;
        }

        function formatTime(seconds) {
            if (!isFinite(seconds)) return 'Calculating...';
            if (seconds < 60) return `${Math.round(seconds)}s`;
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.round(seconds % 60);
            return `${minutes}m ${remainingSeconds}s`;
        }

        // Update connection status based on peer connection state
        if (typeof peer !== 'undefined') {
            peer.onconnectionstatechange = () => {
                connectionStatus.textContent = `Connection Status: ${peer.connectionState}`;
            };
        }
    </script>
</body>
</html>
