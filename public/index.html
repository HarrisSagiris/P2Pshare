<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapShare - Secure File Transfer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3B82F6;
            --primary-hover: #2563EB;
            --primary-light: rgba(59, 130, 246, 0.1);
            --secondary-color: #9CA3AF;
            --success-color: #10B981;
            --error-color: #EF4444;
            --background-color: #111827;
            --surface-color: #1F2937;
            --text-primary: #F9FAFB;
            --text-secondary: #D1D5DB;
            --border-color: #374151;
            --border-radius-sm: 8px;
            --border-radius: 12px;
            --border-radius-lg: 16px;
            --box-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --box-shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            --transition: all 0.2s ease;
            --gradient-primary: linear-gradient(135deg, var(--primary-color), #60A5FA);
            --gradient-success: linear-gradient(135deg, var(--success-color), #34D399);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background-color);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: radial-gradient(circle at top right, #1E3A8A 0%, var(--background-color) 50%);
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface-color);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--box-shadow-lg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            margin: 1rem;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-primary);
        }

        h1 {
            font-size: 2.75rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 1rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--gradient-primary);
            opacity: 0.5;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.25rem;
            margin-bottom: 3.5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .upload-box {
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: 3rem;
            text-align: center;
            background: rgba(31, 41, 55, 0.5);
            transition: var(--transition);
            margin-bottom: 2rem;
            position: relative;
            backdrop-filter: blur(8px);
        }

        .upload-box.dragover {
            border-color: var(--primary-color);
            background: var(--primary-light);
            transform: scale(1.02);
        }

        .upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            min-height: 280px;
            cursor: pointer;
            padding: 2.5rem;
            border-radius: var(--border-radius);
            transition: var(--transition);
            background: rgba(31, 41, 55, 0.3);
        }

        .upload-area:hover {
            background: rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            color: var(--primary-color);
            opacity: 0.9;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.3));
        }

        .upload-text {
            font-size: 1.25rem;
            color: var(--text-primary);
            font-weight: 600;
        }

        .upload-hint {
            font-size: 1rem;
            color: var(--text-secondary);
            background: rgba(31, 41, 55, 0.5);
            padding: 0.5rem 1rem;
            border-radius: 100px;
            backdrop-filter: blur(4px);
        }

        .button {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: var(--border-radius);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            box-shadow: var(--box-shadow), 0 0 0 rgba(59, 130, 246, 0.5);
            position: relative;
            overflow: hidden;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255,255,255,0.1), rgba(255,255,255,0));
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: var(--box-shadow-lg), 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .button:hover::before {
            transform: translateY(0);
        }

        .button:active {
            transform: translateY(0);
        }

        #shareBtn {
            width: 100%;
            max-width: 240px;
            margin: 2rem auto 0;
            height: 3.5rem;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: var(--primary-light);
            border-radius: 100px;
            margin: 1.5rem 0;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--gradient-primary);
            transition: width 0.3s ease;
            border-radius: 100px;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .share-dialog {
            background: var(--surface-color);
            padding: 2.5rem;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--box-shadow-lg);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 520px;
            position: relative;
            animation: dialogFadeIn 0.3s ease;
        }

        @keyframes dialogFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1; 
                transform: translateY(0);
            }
        }

        .share-dialog::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-success);
            border-radius: var(--border-radius-lg) var(--border-radius-lg) 0 0;
        }

        .share-dialog h3 {
            color: var(--text-primary);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            letter-spacing: -0.02em;
        }

        .share-dialog h3::before {
            content: '✨';
            font-size: 1.25rem;
            animation: sparkle 1.5s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .share-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1.25rem;
            margin: 2rem 0;
        }

        .share-option {
            padding: 1.5rem;
            border-radius: var(--border-radius);
            background: rgba(31, 41, 55, 0.5);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .share-option::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .share-option:hover {
            transform: translateY(-3px);
            border-color: var(--primary-color);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.15);
        }

        .share-option:hover::before {
            opacity: 0.1;
        }

        .share-option:active {
            transform: translateY(-1px);
        }

        .share-option-icon {
            font-size: 2rem;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .share-option:hover .share-option-icon {
            transform: scale(1.1);
        }

        .share-option-text {
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--text-primary);
            position: relative;
            z-index: 1;
            text-align: center;
        }

        #shareLink {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 1rem;
            color: var(--text-primary);
            background: rgba(31, 41, 55, 0.5);
            transition: all 0.2s ease;
            font-family: inherit;
            backdrop-filter: blur(8px);
        }

        #shareLink:hover {
            border-color: var(--primary-color);
            background: rgba(31, 41, 55, 0.7);
        }

        #shareLink:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .overlay {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
        }

        .file-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 2rem;
            background: rgba(31, 41, 55, 0.5);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            margin: 1.5rem 0;
            transition: var(--transition);
        }

        .file-preview:hover {
            transform: translateY(-2px);
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .file-preview-icon {
            width: 48px;
            height: 48px;
            color: var(--primary-color);
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.3));
        }

        .file-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 1.125rem;
            text-align: center;
            word-break: break-word;
        }

        .file-size {
            color: var(--text-secondary);
            font-size: 0.9375rem;
            background: rgba(31, 41, 55, 0.5);
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
        }

        .hidden {
            display: none !important;
        }

        #qrCodeDialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface-color);
            padding: 2rem;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--box-shadow-lg);
            z-index: 1000;
            text-align: center;
        }

        #qrCodeDialog img {
            margin: 1rem 0;
            border-radius: var(--border-radius);
            background: white;
            padding: 1rem;
        }

        #qrCodeDialog .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.5rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 2rem;
            }

            h1 {
                font-size: 2.25rem;
            }

            .upload-box {
                padding: 2rem;
            }

            .upload-area {
                min-height: 240px;
            }

            .share-dialog {
                padding: 2rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .upload-box {
                padding: 1.5rem;
            }

            .share-options {
                grid-template-columns: 1fr;
            }

            .upload-icon {
                width: 48px;
                height: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TapShare</h1>
        <p class="subtitle">Secure, fast, and simple file sharing for teams. Just drag, drop, and share.</p>

        <div id="hostSection">
            <div class="upload-box">
                <input type="file" id="fileInput" hidden>
                <label for="fileInput" class="upload-area">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <div class="upload-text">Drop files here or click to upload</div>
                    <div class="upload-hint">Supports any file type up to 2GB</div>
                </label>
                <button id="shareBtn" class="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
                        <polyline points="16 6 12 2 8 6"/>
                        <line x1="12" y1="2" x2="12" y2="15"/>
                    </svg>
                    <span>Share File</span>
                </button>
            </div>

            <div id="result" class="hidden">
                <div class="share-dialog">
                    <h3>Share Your File</h3>
                    <div class="share-options">
                        <div class="share-option" onclick="copyShareLink()">
                            <div class="share-option-icon">📋</div>
                            <span class="share-option-text">Copy Link</span>
                        </div>
                        <div class="share-option" onclick="shareViaEmail()">
                            <div class="share-option-icon">📧</div>
                            <span class="share-option-text">Email</span>
                        </div>
                        <div class="share-option" onclick="shareViaQR()">
                            <div class="share-option-icon">📱</div>
                            <span class="share-option-text">QR Code</span>
                        </div>
                    </div>
                    <input type="text" id="shareLink" readonly placeholder="Generating share link...">
                    <div class="progress-container">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                    <p id="senderStatus"></p>
                </div>
                <div class="overlay"></div>
            </div>
        </div>

        <div id="receiveSection" class="hidden">
            <h2>Your file is ready</h2>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <p id="receiverStatus">Preparing download...</p>
            <a id="downloadLink" class="button hidden" download>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span>Download File</span>
            </a>
        </div>

        <div id="uploadFallback" class="hidden">
            <h3>Alternative Upload Method</h3>
            <form id="uploadForm" enctype="multipart/form-data">
                <input type="file" name="file">
                <button type="submit" class="button">Upload</button>
            </form>
            <div id="uploadResult"></div>
        </div>

        <div id="qrCodeDialog" class="hidden">
            <button class="close-btn" onclick="closeQRDialog()">×</button>
            <h3>Scan QR Code</h3>
            <div id="qrcode"></div>
            <p>Scan with your mobile device to download</p>
        </div>
    </div>

    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
    <script src="script.js"></script>

    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const fileId = urlParams.get('file');

        if (fileId || roomId) {
            document.getElementById('hostSection').classList.add('hidden');
            document.getElementById('receiveSection').classList.remove('hidden');
            
            if (fileId) {
                const downloadLink = document.getElementById('downloadLink');
                downloadLink.href = `/api/download/${fileId}`;
                downloadLink.classList.remove('hidden');
                downloadLink.innerText = 'Download File';
                document.getElementById('receiverStatus').innerText = 'Your file is ready for download';
                document.getElementById('progressBar').style.width = '100%';
            }
        }

        function copyShareLink() {
            const shareLink = document.getElementById('shareLink');
            shareLink.select();
            document.execCommand('copy');
            const option = event.currentTarget;
            const originalText = option.querySelector('span').innerText;
            option.querySelector('span').innerText = 'Copied!';
            option.style.transform = 'scale(1.05)';
            setTimeout(() => {
                option.querySelector('span').innerText = originalText;
                option.style.transform = '';
            }, 2000);
        }

        function shareViaEmail() {
            const shareLink = document.getElementById('shareLink').value;
            window.location.href = `mailto:?subject=File Share&body=Here's your file: ${shareLink}`;
        }

        function shareViaQR() {
            const shareLink = document.getElementById('shareLink').value;
            const qrCodeDialog = document.getElementById('qrCodeDialog');
            const qrcodeContainer = document.getElementById('qrcode');
            
            // Clear previous QR code
            qrcodeContainer.innerHTML = '';
            
            // Generate new QR code
            QRCode.toCanvas(qrcodeContainer, shareLink, {
                width: 200,
                margin: 2,
                color: {
                    dark: '#000000',
                    light: '#FFFFFF'
                }
            }, function(error) {
                if (error) console.error(error);
            });
            
            qrCodeDialog.classList.remove('hidden');
        }

        function closeQRDialog() {
            document.getElementById('qrCodeDialog').classList.add('hidden');
        }

        const uploadArea = document.querySelector('.upload-area');
        const fileInput = document.getElementById('fileInput');

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                uploadArea.parentElement.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                uploadArea.parentElement.classList.remove('dragover');
            });
        });

        uploadArea.addEventListener('drop', (e) => {
            fileInput.files = e.dataTransfer.files;
            updateFilePreview(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            updateFilePreview(e.target.files[0]);
        });

        function updateFilePreview(file) {
            if (!file) return;
            
            const uploadArea = document.querySelector('.upload-area');
            uploadArea.innerHTML = `
                <div class="file-preview">
                    <svg class="file-preview-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V9L13 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <div class="file-name">${file.name}</div>
                    <div class="file-size">${formatFileSize(file.size)}</div>
                </div>
            `;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        document.getElementById('shareBtn').addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                document.getElementById('result').classList.remove('hidden');
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (data.success) {
                    const shareLink = `${window.location.origin}/download/${data.fileId}`;
                    document.getElementById('shareLink').value = shareLink;
                    document.getElementById('progressBar').style.width = '100%';
                }
            } catch (error) {
                console.error('Upload failed:', error);
                document.getElementById('senderStatus').innerText = 'Upload failed. Please try again.';
            }
        });

        socket.on('upload-progress', (progress) => {
            document.getElementById('progressBar').style.width = `${progress}%`;
        });
    </script>
</body>
</html>
