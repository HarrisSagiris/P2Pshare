<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapShare - Enterprise File Transfer Solution</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3b82f6;
            --secondary-color: #2563eb;
            --accent-color: #60a5fa;
            --background-color: #0f172a;
            --surface-color: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-radius: 16px;
            --box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: var(--background-color);
            color: var(--text-color);
            line-height: 1.7;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(96, 165, 250, 0.1) 0%, transparent 50%);
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 2rem;
            padding: 3.5rem;
            background: var(--surface-color);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 0.75rem;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.15rem;
            margin-bottom: 3.5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .upload-box {
            border: 2px dashed rgba(255, 255, 255, 0.1);
            padding: 3.5rem;
            text-align: center;
            border-radius: var(--border-radius);
            margin-bottom: 2.5rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .upload-box.dragover {
            border-color: var(--primary-color);
            background: rgba(37, 99, 235, 0.1);
            transform: scale(1.01);
        }

        .upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 2.5rem;
            min-height: 250px;
            position: relative;
        }

        .upload-area span {
            font-size: 1.25rem;
            color: var(--text-color);
            margin-top: 1.5rem;
            font-weight: 500;
        }

        button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 1.25rem 2.5rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
            position: relative;
            overflow: hidden;
        }

        button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(rgba(255,255,255,0.1), rgba(255,255,255,0));
            opacity: 0;
            transition: opacity 0.3s;
        }

        button:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(37, 99, 235, 0.5);
        }

        button:hover::after {
            opacity: 1;
        }

        #shareBtn {
            width: 100%;
            max-width: 350px;
            margin: 2.5rem auto 0;
            display: block;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            margin: 2rem 0;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 100px;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.15) 50%,
                rgba(255,255,255,0) 100%
            );
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        #shareLink {
            width: 100%;
            padding: 1.25rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin: 1.5rem 0;
            font-size: 1.1rem;
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        #shareLink:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .download-button {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 1.4rem 3.5rem;
            border-radius: 12px;
            margin-top: 2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
            position: relative;
            overflow: hidden;
        }

        .download-button:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(37, 99, 235, 0.5);
        }

        .hidden {
            display: none;
        }

        #uploadFallback {
            margin-top: 3.5rem;
            padding: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            background: rgba(255, 255, 255, 0.03);
        }

        #uploadResult {
            margin-top: 2rem;
            padding: 2rem;
            border-radius: var(--border-radius);
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #uploadResult a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            position: relative;
        }

        #uploadResult a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-color);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        #uploadResult a:hover::after {
            transform: scaleX(1);
        }

        .file-preview {
            background: rgba(255, 255, 255, 0.03);
            padding: 2rem;
            border-radius: var(--border-radius);
            margin: 1.5rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .file-preview:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .file-icon {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .share-dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface-color);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            width: 90%;
            max-width: 500px;
        }

        .share-dialog h3 {
            margin-top: 0;
            color: var(--text-color);
        }

        .share-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .share-option {
            padding: 1rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .share-option:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 999;
        }

        @media (max-width: 768px) {
            .container {
                margin: 1rem;
                padding: 2rem;
            }

            h1 {
                font-size: 2.5rem;
            }

            .upload-box {
                padding: 2rem;
            }

            .upload-area {
                min-height: 200px;
            }

            button {
                padding: 1rem 2rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 1rem;
            }

            .upload-box {
                padding: 1.5rem;
            }

            .file-icon {
                font-size: 2.5rem;
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TapShare</h1>
        <p>Enterprise-grade file sharing platform with military-grade encryption and lightning-fast transfer speeds.</p>

        <div id="hostSection">
            <div class="upload-box">
                <input type="file" id="fileInput" hidden>
                <label for="fileInput" class="upload-area">
                    <div class="file-icon">📤</div>
                    <span>Drag & drop your files here or click to browse</span>
                </label>
                <button id="shareBtn">
                    <span>Share Securely</span>
                </button>
            </div>

            <div id="result" class="hidden">
                <div class="share-dialog">
                    <h3>Share Your File</h3>
                    <div class="share-options">
                        <div class="share-option" onclick="copyShareLink()">
                            <div>📋</div>
                            <span>Copy Link</span>
                        </div>
                        <div class="share-option" onclick="shareViaEmail()">
                            <div>📧</div>
                            <span>Email</span>
                        </div>
                        <div class="share-option" onclick="shareViaQR()">
                            <div>📱</div>
                            <span>QR Code</span>
                        </div>
                    </div>
                    <input type="text" id="shareLink" readonly>
                    <div class="progress-container">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                    <p id="senderStatus"></p>
                </div>
                <div class="overlay"></div>
            </div>
        </div>

        <div id="receiveSection" class="hidden">
            <h2>Your secure file is ready!</h2>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <p id="receiverStatus">Preparing your secure download...</p>
            <a id="downloadLink" class="hidden download-button" download>Download Securely</a>
        </div>

        <div id="uploadFallback" class="hidden">
            <h3>Using enterprise upload method...</h3>
            <form id="uploadForm" enctype="multipart/form-data">
                <input type="file" name="file">
                <button type="submit">Upload Securely</button>
            </form>
            <div id="uploadResult"></div>
        </div>
    </div>

    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <script src="script.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const fileId = urlParams.get('file');

        if (fileId || roomId) {
            document.getElementById('hostSection').classList.add('hidden');
            document.getElementById('receiveSection').classList.remove('hidden');
            
            if (fileId) {
                const downloadLink = document.getElementById('downloadLink');
                downloadLink.href = `/download/${fileId}`;
                downloadLink.classList.remove('hidden');
                downloadLink.innerText = 'Download Securely';
                document.getElementById('receiverStatus').innerText = 'Your file is ready for secure download!';
                document.getElementById('progressBar').style.width = '100%';
            }
        }

        function copyShareLink() {
            const shareLink = document.getElementById('shareLink');
            shareLink.select();
            document.execCommand('copy');
            const option = event.currentTarget;
            const originalText = option.querySelector('span').innerText;
            option.querySelector('span').innerText = 'Copied!';
            setTimeout(() => {
                option.querySelector('span').innerText = originalText;
            }, 2000);
        }

        function shareViaEmail() {
            const shareLink = document.getElementById('shareLink').value;
            window.location.href = `mailto:?subject=Secure File Share&body=Here's your secure file: ${shareLink}`;
        }

        function shareViaQR() {
            // Implement QR code generation here
            alert('QR Code sharing coming soon!');
        }

        const uploadArea = document.querySelector('.upload-area');
        const fileInput = document.getElementById('fileInput');

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                uploadArea.parentElement.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                uploadArea.parentElement.classList.remove('dragover');
            });
        });

        uploadArea.addEventListener('drop', (e) => {
            fileInput.files = e.dataTransfer.files;
            updateFilePreview(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            updateFilePreview(e.target.files[0]);
        });

        function updateFilePreview(file) {
            if (!file) return;
            
            const span = uploadArea.querySelector('span');
            span.innerHTML = `
                <div class="file-preview">
                    <div class="file-icon">📄</div>
                    <div style="font-size: 1.2rem; margin-bottom: 0.75rem; font-weight: 600; color: var(--text-color);">${file.name}</div>
                    <div style="color: var(--text-muted);">
                        Size: ${formatFileSize(file.size)}<br>
                        Type: ${file.type || 'Unknown'}
                    </div>
                </div>
            `;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const submitButton = e.target.querySelector('button');
            submitButton.disabled = true;
            submitButton.innerText = 'Uploading...';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.success) {
                    document.getElementById('uploadResult').innerHTML = `
                        <div style="background: rgba(16, 185, 129, 0.1); padding: 2rem; border-radius: var(--border-radius); box-shadow: 0 4px 20px rgba(0,0,0,0.2);">
                            File uploaded successfully! 
                            <a href="${result.downloadLink}">Secure Download Link</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Upload failed:', error);
                document.getElementById('uploadResult').innerHTML = `
                    <div style="background: rgba(239, 68, 68, 0.1); padding: 2rem; border-radius: var(--border-radius); box-shadow: 0 4px 20px rgba(0,0,0,0.2);">
                        Upload failed. Please try again.
                    </div>
                `;
            } finally {
                submitButton.disabled = false;
                submitButton.innerText = 'Upload Securely';
            }
        });
    </script>
</body>
</html>
