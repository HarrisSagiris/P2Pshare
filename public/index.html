<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapShare - Secure File Transfer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0066FF;
            --secondary-color: #0052CC;
            --accent-color: #66B2FF;
            --background-color: #F5F7FA;
            --surface-color: #FFFFFF;
            --text-color: #1D2939;
            --text-muted: #667085;
            --border-radius: 12px;
            --box-shadow: 0 1px 3px rgba(16, 24, 40, 0.1), 0 1px 2px rgba(16, 24, 40, 0.06);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: var(--background-color);
            color: var(--text-color);
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 95%;
            max-width: 800px;
            margin: 2rem;
            padding: 2rem;
            background: var(--surface-color);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            border: 1px solid #E5E7EB;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.75rem;
            color: var(--text-color);
        }

        p {
            text-align: center;
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .upload-box {
            border: 2px dashed #E5E7EB;
            padding: 2rem;
            text-align: center;
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
            transition: all 0.2s ease;
            background: #F9FAFB;
        }

        .upload-box.dragover {
            border-color: var(--primary-color);
            background: #F0F7FF;
        }

        .upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 2rem;
            min-height: 200px;
        }

        .upload-area span {
            font-size: 1rem;
            color: var(--text-muted);
            margin-top: 1rem;
            font-weight: 500;
        }

        button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
        }

        button:hover {
            background: var(--secondary-color);
        }

        #shareBtn {
            width: 100%;
            max-width: 200px;
            margin: 1.5rem auto 0;
            display: block;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: #F0F7FF;
            border-radius: 100px;
            margin: 1.5rem 0;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary-color);
            transition: width 0.3s ease;
            border-radius: 100px;
        }

        #shareLink {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #E5E7EB;
            border-radius: 6px;
            margin: 1rem 0;
            font-size: 0.875rem;
            color: var(--text-color);
            background: #F9FAFB;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        #shareLink:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px #E6F0FF;
        }

        .download-button {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            margin-top: 1.5rem;
            transition: all 0.2s ease;
            font-weight: 500;
            font-size: 0.875rem;
        }

        .download-button:hover {
            background: var(--secondary-color);
        }

        .hidden {
            display: none;
        }

        .share-dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface-color);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid #E5E7EB;
            z-index: 1000;
            width: 90%;
            max-width: 400px;
        }

        .share-dialog h3 {
            margin-top: 0;
            color: var(--text-color);
            font-size: 1.125rem;
            font-weight: 600;
        }

        .share-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin: 1rem 0;
        }

        .share-option {
            padding: 0.75rem;
            border-radius: 6px;
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .share-option:hover {
            background: #F0F7FF;
            border-color: var(--primary-color);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 999;
        }

        @media (max-width: 768px) {
            .container {
                margin: 1rem;
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.875rem;
            }

            .upload-box {
                padding: 1.5rem;
            }

            .upload-area {
                min-height: 150px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            p {
                font-size: 0.875rem;
            }

            .upload-box {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TapShare</h1>
        <p>Simple, secure file sharing for teams. Just drag, drop, and share.</p>

        <div id="hostSection">
            <div class="upload-box">
                <input type="file" id="fileInput" hidden>
                <label for="fileInput" class="upload-area">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5V19M5 12H19" stroke="#0066FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Drop files here or click to upload</span>
                </label>
                <button id="shareBtn">
                    <span>Share File</span>
                </button>
            </div>

            <div id="result" class="hidden">
                <div class="share-dialog">
                    <h3>Share File</h3>
                    <div class="share-options">
                        <div class="share-option" onclick="copyShareLink()">
                            <div>📋</div>
                            <span>Copy</span>
                        </div>
                        <div class="share-option" onclick="shareViaEmail()">
                            <div>📧</div>
                            <span>Email</span>
                        </div>
                        <div class="share-option" onclick="shareViaQR()">
                            <div>📱</div>
                            <span>QR</span>
                        </div>
                    </div>
                    <input type="text" id="shareLink" readonly>
                    <div class="progress-container">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                    <p id="senderStatus"></p>
                </div>
                <div class="overlay"></div>
            </div>
        </div>

        <div id="receiveSection" class="hidden">
            <h2>Your file is ready</h2>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <p id="receiverStatus">Preparing download...</p>
            <a id="downloadLink" class="hidden download-button" download>Download File</a>
        </div>

        <div id="uploadFallback" class="hidden">
            <h3>Alternative Upload Method</h3>
            <form id="uploadForm" enctype="multipart/form-data">
                <input type="file" name="file">
                <button type="submit">Upload</button>
            </form>
            <div id="uploadResult"></div>
        </div>
    </div>

    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <script src="script.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const fileId = urlParams.get('file');

        if (fileId || roomId) {
            document.getElementById('hostSection').classList.add('hidden');
            document.getElementById('receiveSection').classList.remove('hidden');
            
            if (fileId) {
                const downloadLink = document.getElementById('downloadLink');
                downloadLink.href = `/download/${fileId}`;
                downloadLink.classList.remove('hidden');
                downloadLink.innerText = 'Download File';
                document.getElementById('receiverStatus').innerText = 'Your file is ready for download';
                document.getElementById('progressBar').style.width = '100%';
            }
        }

        function copyShareLink() {
            const shareLink = document.getElementById('shareLink');
            shareLink.select();
            document.execCommand('copy');
            const option = event.currentTarget;
            const originalText = option.querySelector('span').innerText;
            option.querySelector('span').innerText = 'Copied';
            setTimeout(() => {
                option.querySelector('span').innerText = originalText;
            }, 2000);
        }

        function shareViaEmail() {
            const shareLink = document.getElementById('shareLink').value;
            window.location.href = `mailto:?subject=File Share&body=Here's your file: ${shareLink}`;
        }

        function shareViaQR() {
            alert('QR Code sharing coming soon');
        }

        const uploadArea = document.querySelector('.upload-area');
        const fileInput = document.getElementById('fileInput');

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                uploadArea.parentElement.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                uploadArea.parentElement.classList.remove('dragover');
            });
        });

        uploadArea.addEventListener('drop', (e) => {
            fileInput.files = e.dataTransfer.files;
            updateFilePreview(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            updateFilePreview(e.target.files[0]);
        });

        function updateFilePreview(file) {
            if (!file) return;
            
            const span = uploadArea.querySelector('span');
            span.innerHTML = `
                <div class="file-preview">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V9L13 2Z" stroke="#0066FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <div style="font-size: 0.875rem; margin: 0.5rem 0; font-weight: 500; color: var(--text-color);">${file.name}</div>
                    <div style="color: var(--text-muted); font-size: 0.75rem;">
                        ${formatFileSize(file.size)}
                    </div>
                </div>
            `;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const submitButton = e.target.querySelector('button');
            submitButton.disabled = true;
            submitButton.innerText = 'Uploading...';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.success) {
                    document.getElementById('uploadResult').innerHTML = `
                        <div style="background: #ECFDF5; padding: 1rem; border-radius: 6px; margin-top: 1rem;">
                            File uploaded successfully! 
                            <a href="${result.downloadLink}" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Download Link</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Upload failed:', error);
                document.getElementById('uploadResult').innerHTML = `
                    <div style="background: #FEF2F2; padding: 1rem; border-radius: 6px; margin-top: 1rem;">
                        Upload failed. Please try again.
                    </div>
                `;
            } finally {
                submitButton.disabled = false;
                submitButton.innerText = 'Upload';
            }
        });
    </script>
</body>
</html>
