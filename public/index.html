<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapShare - Secure File Transfer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0066FF;
            --primary-hover: #0052CC;
            --primary-light: #E6F0FF;
            --secondary-color: #667085;
            --success-color: #12B76A;
            --error-color: #F04438;
            --background-color: #F9FAFB;
            --surface-color: #FFFFFF;
            --text-primary: #1D2939;
            --text-secondary: #475467;
            --border-color: #E5E7EB;
            --border-radius-sm: 8px;
            --border-radius: 12px;
            --border-radius-lg: 16px;
            --box-shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
            --box-shadow: 0 4px 6px -1px rgba(16, 24, 40, 0.1), 0 2px 4px -1px rgba(16, 24, 40, 0.06);
            --box-shadow-lg: 0 20px 25px -5px rgba(16, 24, 40, 0.1), 0 10px 10px -5px rgba(16, 24, 40, 0.04);
            --transition: all 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background-color);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface-color);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--box-shadow);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            margin: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary-color), #3B82F6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.125rem;
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .upload-box {
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            padding: 2.5rem;
            text-align: center;
            background: var(--background-color);
            transition: var(--transition);
            margin-bottom: 2rem;
        }

        .upload-box.dragover {
            border-color: var(--primary-color);
            background: var(--primary-light);
        }

        .upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            min-height: 240px;
            cursor: pointer;
            padding: 2rem;
            border-radius: var(--border-radius-sm);
            transition: var(--transition);
        }

        .upload-area:hover {
            background: rgba(0, 102, 255, 0.04);
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            color: var(--primary-color);
            opacity: 0.9;
        }

        .upload-text {
            font-size: 1.125rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .upload-hint {
            font-size: 0.875rem;
            color: var(--secondary-color);
        }

        .button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.875rem 1.75rem;
            border-radius: var(--border-radius-sm);
            font-weight: 600;
            font-size: 0.9375rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: var(--box-shadow-sm);
        }

        .button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        #shareBtn {
            width: 100%;
            max-width: 200px;
            margin: 1.5rem auto 0;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: var(--primary-light);
            border-radius: 100px;
            margin: 1.5rem 0;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), #3B82F6);
            transition: width 0.3s ease;
            border-radius: 100px;
        }

        .share-dialog {
            background: var(--surface-color);
            padding: 2rem;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--box-shadow-lg);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 480px;
        }

        .share-dialog h3 {
            color: var(--text-primary);
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .share-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .share-option {
            padding: 1rem;
            border-radius: var(--border-radius-sm);
            background: var(--background-color);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .share-option:hover {
            background: var(--primary-light);
            border-color: var(--primary-color);
            transform: translateY(-1px);
        }

        .share-option-icon {
            font-size: 1.5rem;
        }

        .share-option-text {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        #shareLink {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            font-size: 0.9375rem;
            color: var(--text-primary);
            background: var(--background-color);
            transition: var(--transition);
            font-family: inherit;
        }

        #shareLink:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .overlay {
            background: rgba(16, 24, 40, 0.6);
            backdrop-filter: blur(4px);
        }

        .file-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            padding: 1.5rem;
            background: var(--surface-color);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            margin: 1rem 0;
        }

        .file-preview-icon {
            width: 40px;
            height: 40px;
            color: var(--primary-color);
        }

        .file-name {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
            word-break: break-word;
        }

        .file-size {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .upload-box {
                padding: 1.5rem;
            }

            .upload-area {
                min-height: 200px;
            }

            .share-dialog {
                padding: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.75rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .upload-box {
                padding: 1rem;
            }

            .share-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TapShare</h1>
        <p class="subtitle">Secure, fast, and simple file sharing for teams. Just drag, drop, and share.</p>

        <div id="hostSection">
            <div class="upload-box">
                <input type="file" id="fileInput" hidden>
                <label for="fileInput" class="upload-area">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <div class="upload-text">Drop files here or click to upload</div>
                    <div class="upload-hint">Supports any file type up to 2GB</div>
                </label>
                <button id="shareBtn" class="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
                        <polyline points="16 6 12 2 8 6"/>
                        <line x1="12" y1="2" x2="12" y2="15"/>
                    </svg>
                    <span>Share File</span>
                </button>
            </div>

            <div id="result" class="hidden">
                <div class="share-dialog">
                    <h3>Share Your File</h3>
                    <div class="share-options">
                        <div class="share-option" onclick="copyShareLink()">
                            <div class="share-option-icon">📋</div>
                            <span class="share-option-text">Copy Link</span>
                        </div>
                        <div class="share-option" onclick="shareViaEmail()">
                            <div class="share-option-icon">📧</div>
                            <span class="share-option-text">Email</span>
                        </div>
                        <div class="share-option" onclick="shareViaQR()">
                            <div class="share-option-icon">📱</div>
                            <span class="share-option-text">QR Code</span>
                        </div>
                    </div>
                    <input type="text" id="shareLink" readonly placeholder="Generating share link...">
                    <div class="progress-container">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                    <p id="senderStatus"></p>
                </div>
                <div class="overlay"></div>
            </div>
        </div>

        <div id="receiveSection" class="hidden">
            <h2>Your file is ready</h2>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <p id="receiverStatus">Preparing download...</p>
            <a id="downloadLink" class="button hidden" download>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span>Download File</span>
            </a>
        </div>

        <div id="uploadFallback" class="hidden">
            <h3>Alternative Upload Method</h3>
            <form id="uploadForm" enctype="multipart/form-data">
                <input type="file" name="file">
                <button type="submit" class="button">Upload</button>
            </form>
            <div id="uploadResult"></div>
        </div>
    </div>

    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <script src="script.js"></script>

    <script>
                const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const fileId = urlParams.get('file');

        if (fileId || roomId) {
            document.getElementById('hostSection').classList.add('hidden');
            document.getElementById('receiveSection').classList.remove('hidden');
            
            if (fileId) {
                const downloadLink = document.getElementById('downloadLink');
                downloadLink.href = `/download/${fileId}`;
                downloadLink.classList.remove('hidden');
                downloadLink.innerText = 'Download File';
                document.getElementById('receiverStatus').innerText = 'Your file is ready for download';
                document.getElementById('progressBar').style.width = '100%';
            }
        }

        function copyShareLink() {
            const shareLink = document.getElementById('shareLink');
            shareLink.select();
            document.execCommand('copy');
            const option = event.currentTarget;
            const originalText = option.querySelector('span').innerText;
            option.querySelector('span').innerText = 'Copied';
            setTimeout(() => {
                option.querySelector('span').innerText = originalText;
            }, 2000);
        }

        function shareViaEmail() {
            const shareLink = document.getElementById('shareLink').value;
            window.location.href = `mailto:?subject=File Share&body=Here's your file: ${shareLink}`;
        }

        function shareViaQR() {
            alert('QR Code sharing coming soon');
        }

        const uploadArea = document.querySelector('.upload-area');
        const fileInput = document.getElementById('fileInput');

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                uploadArea.parentElement.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                uploadArea.parentElement.classList.remove('dragover');
            });
        });

        uploadArea.addEventListener('drop', (e) => {
            fileInput.files = e.dataTransfer.files;
            updateFilePreview(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            updateFilePreview(e.target.files[0]);
        });

        function updateFilePreview(file) {
            if (!file) return;
            
            const span = uploadArea.querySelector('span');
            span.innerHTML = `
                <div class="file-preview">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V9L13 2Z" stroke="#0066FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <div style="font-size: 0.875rem; margin: 0.5rem 0; font-weight: 500; color: var(--text-color);">${file.name}</div>
                    <div style="color: var(--text-muted); font-size: 0.75rem;">
                        ${formatFileSize(file.size)}
                    </div>
                </div>
            `;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const submitButton = e.target.querySelector('button');
            submitButton.disabled = true;
            submitButton.innerText = 'Uploading...';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.success) {
                    document.getElementById('uploadResult').innerHTML = `
                        <div style="background: #ECFDF5; padding: 1rem; border-radius: 6px; margin-top: 1rem;">
                            File uploaded successfully! 
                            <a href="${result.downloadLink}" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Download Link</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Upload failed:', error);
                document.getElementById('uploadResult').innerHTML = `
                    <div style="background: #FEF2F2; padding: 1rem; border-radius: 6px; margin-top: 1rem;">
                        Upload failed. Please try again.
                    </div>
                `;
            } finally {
                submitButton.disabled = false;
                submitButton.innerText = 'Upload';
            }
        });
    </script>
</body>
</html>
