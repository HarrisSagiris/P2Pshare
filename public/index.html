<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P File Sharing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Instant P2P File Sharing</h1>
        <p>Send files directly between devices using WebRTC.</p>
        
        <div class="upload-box">
            <input type="file" id="fileInput" hidden>
            <label for="fileInput" class="upload-area">
                <span>📂 Drag & Drop or Click to Select a File</span>
            </label>
            <button id="shareBtn">Share File</button>
        </div>

        <div id="result" class="hidden">
            <input type="text" id="shareLink" readonly>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <div id="receiveSection" class="hidden">
            <h2>Receiving File...</h2>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <p id="receiverStatus">Waiting for connection...</p>
            <a id="downloadLink" class="hidden download-button" download>Download File</a>
        </div>
    </div>

    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <script src="script.js"></script>

    <script>
        // Add drag and drop functionality
        const uploadArea = document.querySelector('.upload-area');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            fileInput.files = e.dataTransfer.files;
            updateFilePreview(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            updateFilePreview(e.target.files[0]);
        });

        function updateFilePreview(file) {
            if (!file) return;
            
            const span = uploadArea.querySelector('span');
            span.innerHTML = `
                📂 Selected: ${file.name}<br>
                Size: ${formatFileSize(file.size)}<br>
                Type: ${file.type || 'Unknown'}
            `;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
